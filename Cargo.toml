[workspace]
members = [
    "crates/ssh",
    "crates/health",
    "app",
    "tools/lab",
    "crates/telemetry",
    "crates/collection",
    "tools/telemetry-demo",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/ValdonVitija/omnisor"
authors = ["Valdon Vitija <valdonvitijaa@gmail.com>"]

[workspace.dependencies]
log = "0.4"
regex = "1.12.2"
russh = "0.55.0"
russh-sftp = "2.4.0"
thiserror = "2.0.17"
tokio = { version = "1.45.1", features = ["fs"] }
dotenv = "0.15.0"
