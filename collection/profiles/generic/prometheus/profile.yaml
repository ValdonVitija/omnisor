id: native-prometheus
revision: '1'
title: Prometheus / canonical exporter schema
vendor: User supplied
os: User supplied
support: Endpoint must expose the documented metric names; arbitrary exporter schemas need their own mapping profile.
adapters: [prometheus]
mappings:
  omnisor_cpu_utilization_ratio:
    name: device.cpu.utilization
    unit: '1'
    conversion: ratio
    entity_label: cpu
    kind: gauge
  omnisor_memory_used_bytes:
    name: device.memory.used
    unit: By
    conversion: identity
    entity_label: pool
    kind: gauge
  omnisor_memory_free_bytes:
    name: device.memory.free
    unit: By
    conversion: identity
    entity_label: pool
    kind: gauge
  omnisor_interface_admin_status:
    name: interface.admin_status
    unit: '1'
    conversion: admin_state
    entity_label: interface
    kind: gauge
  omnisor_interface_oper_status:
    name: interface.oper_status
    unit: '1'
    conversion: oper_state
    entity_label: interface
    kind: gauge
  omnisor_interface_receive_bytes_total:
    name: interface.receive.bytes
    unit: By
    conversion: identity
    entity_label: interface
    kind: cumulative_counter
  omnisor_interface_transmit_bytes_total:
    name: interface.transmit.bytes
    unit: By
    conversion: identity
    entity_label: interface
    kind: cumulative_counter
