[package]
name = "app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "Standalone GPUI network troubleshooting workbench"

[features]
# Keep the workspace model testable on headless machines without native GUI SDKs.
default = []
gui = ["dep:gpui", "dep:chrono", "dep:unicode-segmentation"]

[[bin]]
name = "omnisor"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
gpui = { version = "=0.2.2", optional = true, features = ["runtime_shaders"] }
telemetry = { path = "../crates/telemetry" }
collection = { path = "../crates/collection" }
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
