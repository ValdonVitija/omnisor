[package]
name = "omnisor"
version.workspace = true
edition.workspace = true
license-file.workspace = true
readme = "README.md"
description = "Omnisor is an asynchronous high-level SSH client library for network devices."
keywords = ["async", "ssh-client", "high-level", "networking"]
repository.workspace = true
categories = ["network-programming"]
authors.workspace = true

[features]
openssl = []
# Enables tests that require the SSH/HTTP services and keys in tests/.
ssh-integration-tests = []

[dependencies]
russh.workspace = true
log.workspace = true
russh-sftp.workspace = true
thiserror.workspace = true
tokio.workspace = true
regex.workspace = true

[dev-dependencies]
dotenv.workspace = true
omnisor-lab = { path = "../../tools/omnisor-lab" }
