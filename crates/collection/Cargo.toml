[package]
name = "collection"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "Local collection plans, managed processes, OTLP ingestion and bounded metric history"

[dependencies]
axum = "0.8"
telemetry = { path = "../telemetry" }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
subtle = "2"
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "process", "io-util", "macros"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
